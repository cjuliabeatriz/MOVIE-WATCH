<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>MOVIE WATCH - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="cabeçalho">
        <nav>
            <a href="../pg_1/index.html" id="nav_inicio">Inicio</a>
            <a href="../pg_2/pg2.html" id="nav_filmes">Filmes</a>
            <a href="../pg_3/pg3.html" id="nav_favoritos">Favoritos</a>
            <a href="../pg_4/pg4.html" id="nav_perfil">Perfil</a>
            <a href="login.html" id="nav_login" class="ativo">Login</a>
            <a href="../pg_5/cadastro.html" id="nav_cadastro">Criar Conta</a>
            <a href="#" id="nav_sair">Sair</a>
        </nav>
        <img src="../pg_1/logo.png" alt="logo_topo">
    </div>

    <div id="busca_e_frase">
        <div class="container">
            <h1 id="clara_h1">BEM-VINDO</h1>
            <h1 id="roxa_h1"> DE VOLTA </h1>
            <p id="P">Faça login para acessar seus favoritos e perfil.</p>
        </div>
    </div>

    <div class="corpo">
        <div class="container">
            <div class="card-login">
                <form id="form_login">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <button type="submit" class="btn-login">Entrar</button>
                </form>

                <div class="link-cadastro">
                    Não tem uma conta? <a href="../pg_5/cadastro.html">Criar conta</a>
                </div>

                <div id="msg_erro" class="msg erro" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="../_shared/auth.js"></script>
    <script>
        atualizarMenu();
    </script>
    <script src="login.js"></script>
</body>

</html>
