<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>MOVIE WATCH - Perfil</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pg4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="cabeçalho">
        <nav>
            <a href="../pg_1/index.html" id="nav_inicio">Inicio</a>
            <a href="../pg_2/pg2.html" id="nav_filmes">Filmes</a>
            <a href="../pg_3/pg3.html" id="nav_favoritos">Favoritos</a>
            <a href="pg4.html" id="nav_perfil" class="ativo">Perfil</a>
            <a href="../pg_6/login.html" id="nav_login">Login</a>
            <a href="../pg_5/cadastro.html" id="nav_cadastro">Criar Conta</a>
            <a href="#" id="nav_sair">Sair</a>
        </nav>
        <img src="../pg_1/logo.png" alt="logo_topo">
    </div>

    <div id="busca_e_frase">
        <div class="container">
            <h1 id="clara_h1">SEU</h1>
            <h1 id="roxa_h1"> PERFIL </h1>
            <p id="P">Gerencie suas informações de conta.</p>
        </div>
    </div>

    <div class="corpo">
        <div class="container">
            <div id="perfil_carregando" class="carregando">
                <p>Carregando perfil...</p>
            </div>

            <div id="perfil_conteudo" class="perfil-card" style="display: none;">
                <div class="perfil-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h2 id="perfil_nome" class="perfil-nome"></h2>
                <p id="perfil_email" class="perfil-email"></p>
                <p id="perfil_username" class="perfil-username"></p>
                <p id="perfil_criado" class="perfil-criado"></p>

                <div class="perfil-edicao" id="perfil_edicao" style="display: none; margin-top: 25px;">
                    <div class="campo-edicao">
                        <label for="edit_nome">Nome</label>
                        <input type="text" id="edit_nome" name="nome" placeholder="Seu nome">
                    </div>
                    <div class="campo-edicao">
                        <label for="edit_email">E-mail</label>
                        <input type="email" id="edit_email" name="email" placeholder="seu@email.com">
                    </div>
                    <div class="campo-edicao">
                        <label for="edit_username">Nome de usuário (username)</label>
                        <input type="text" id="edit_username" name="username" placeholder="seu_usuario">
                    </div>
                    <div class="campo-edicao campo-foto">
                        <label for="edit_foto">Foto de perfil</label>
                        <input type="file" id="edit_foto" name="foto" accept="image/*">
                        <small class="dica-foto">Funcionalidade de upload em breve.</small>
                    </div>
                    <div class="acoes-edicao">
                        <button id="btn_salvar_edicao" class="btn-salvar-edicao">Salvar alterações</button>
                        <button id="btn_cancelar_edicao" class="btn-cancelar-edicao">Cancelar</button>
                    </div>
                </div>

                <div class="perfil-acoes">
                    <a href="../pg_3/pg3.html" class="btn-perfil">
                        <i class="fa-solid fa-heart"></i> Meus Favoritos
                    </a>
                    <button id="btn_editar_perfil" class="btn-perfil btn-editar">
                        <i class="fa-solid fa-pen"></i> Editar Perfil
                    </button>
                    <button id="btn_sair" class="btn-perfil btn-sair">
                        <i class="fa-solid fa-sign-out-alt"></i> Sair da Conta
                    </button>
                </div>
            </div>

            <div id="perfil_erro" class="erro" style="display: none;">
                <p>Não foi possível carregar seu perfil.</p>
                <button onclick="tentarNovamente()" class="btn-retry">Tentar Novamente</button>
                <p class="erro-hint">Se não estiver logado, será redirecionado para o login.</p>
            </div>
        </div>
    </div>

    <script src="../_shared/auth.js"></script>
    <script>
        atualizarMenu();
    </script>
    <script src="pg4.js"></script>
</body>

</html>
