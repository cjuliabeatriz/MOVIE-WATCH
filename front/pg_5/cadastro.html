<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>MOVIE WATCH - Criar Conta</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="cabeçalho">
        <nav>
            <a href="../pg_1/index.html" id="nav_inicio">Inicio</a>
            <a href="../pg_2/pg2.html" id="nav_filmes">Filmes</a>
            <a href="../pg_3/pg3.html" id="nav_favoritos">Favoritos</a>
            <a href="../pg_4/pg4.html" id="nav_perfil">Perfil</a>
            <a href="../pg_6/login.html" id="nav_login">Login</a>
            <a href="cadastro.html" id="nav_cadastro" class="ativo">Criar Conta</a>
            <a href="#" id="nav_sair">Sair</a>
        </nav>
        <img src="../pg_1/logo.png" alt="logo_topo">
    </div>

    <div id="busca_e_frase">
        <div class="container">
            <h1 id="clara_h1">CRIE</h1>
            <h1 id="roxa_h1"> SUA CONTA </h1>
            <p id="P">Junte-se ao Movie Watch e comece a favoritar filmes.</p>
        </div>
    </div>

    <div class="corpo">
        <div class="container">
            <div class="card-cadastro">
                <form id="form_cadastro">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="name" placeholder="Seu nome" required minlength="2" maxlength="100">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required maxlength="150">
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="password" placeholder="••••••••" required minlength="8" maxlength="72">
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <button type="submit" class="btn-cadastrar">Criar Conta</button>
                </form>

                <div class="link-login">
                    Já tem uma conta? <a href="../pg_6/login.html">Faça login</a>
                </div>

                <div id="msg_sucesso" class="msg sucesso" style="display: none;">
                    <i class="fa-solid fa-check-circle"></i> Conta criada com sucesso! <a href="../pg_6/login.html">Faça login</a>
                </div>

                <div id="msg_erro" class="msg erro" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="../_shared/auth.js"></script>
    <script>
        atualizarMenu();
    </script>
    <script src="cadastro.js"></script>
</body>

</html>
